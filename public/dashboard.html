<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - SkillUp Academy Ops</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-light">

    <!-- Navigation Bar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/">SkillUp Academy Ops</a>
            <div>
                <a href="/" class="btn btn-outline-light btn-sm me-2">Home</a>
                <a href="/entry.html" class="btn btn-outline-light btn-sm me-2">Add Record</a>
                <a href="/dashboard.html" class="btn btn-outline-light btn-sm active">Dashboard</a>
            </div>
        </div>
    </nav>

    <div class="container my-4">
        <!-- Dashboard Header & Download CSV Button -->
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="fw-bold m-0">KPI Operations Dashboard</h2>
            <a href="/export" class="btn btn-success">
                Download CSV
            </a>
        </div>

        <!-- Aggregate Cards -->
        <div class="row g-3 mb-4">
            <div class="col-md-4">
                <div class="card shadow-sm border-0 text-center p-3">
                    <div class="text-muted small">Total Enrollments</div>
                    <div class="display-6 fw-bold text-primary" id="totalEnrollments">0</div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card shadow-sm border-0 text-center p-3">
                    <div class="text-muted small">Total Completions</div>
                    <div class="display-6 fw-bold text-success" id="totalCompletions">0</div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card shadow-sm border-0 text-center p-3">
                    <div class="text-muted small">Total Revenue</div>
                    <div class="display-6 fw-bold text-dark" id="totalRevenue">PKR 0</div>
                </div>
            </div>
        </div>

        <!-- Charts Section -->
        <div class="row g-4">
            <div class="col-md-6">
                <div class="card shadow-sm border-0 p-3">
                    <h5 class="card-title text-muted mb-3">Enrollments Over Time</h5>
                    <div style="height: 300px;">
                        <canvas id="enrollmentsChart"></canvas>
                    </div>
                </div>
            </div>
            <div class="col-md-6">
                <div class="card shadow-sm border-0 p-3">
                    <h5 class="card-title text-muted mb-3">Revenue per Course</h5>
                    <div style="height: 300px;">
                        <canvas id="revenueChart"></canvas>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Dashboard Logic Script -->
    <script src="/js/dashboard.js"></script>
</body>
</html>
