<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KPI Dashboard - SkillUp Academy</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-light">

    <!-- Navigation Bar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand font-weight-bold" href="/">SkillUp Academy Ops</a>
            <div>
                <a href="/" class="btn btn-outline-light btn-sm me-2">Home</a>
                <a href="/entry.html" class="btn btn-outline-light btn-sm me-2">Add Record</a>
                <a href="/dashboard.html" class="btn btn-primary btn-sm">Dashboard</a>
            </div>
        </div>
    </nav>

    <div class="container mb-5">
        <h2 class="mb-4">KPI Operations Dashboard</h2>

        <!-- Aggregate Summary Cards -->
        <div class="row g-3 mb-4">
            <div class="col-md-4">
                <div class="card border-0 shadow-sm text-center bg-white p-3">
                    <span class="text-muted small">Total Enrollments</span>
                    <h3 id="totalEnrollments" class="fw-bold text-primary mb-0">-</h3>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card border-0 shadow-sm text-center bg-white p-3">
                    <span class="text-muted small">Total Completions</span>
                    <h3 id="totalCompletions" class="fw-bold text-success mb-0">-</h3>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card border-0 shadow-sm text-center bg-white p-3">
                    <span class="text-muted small">Total Revenue</span>
                    <h3 id="totalRevenue" class="fw-bold text-dark mb-0">-</h3>
                </div>
            </div>
        </div>

        <!-- Charts Section -->
        <div class="row g-4">
            <!-- Line Chart: Enrollments Over Time -->
            <div class="col-lg-6">
                <div class="card border-0 shadow-sm p-3">
                    <h5 class="card-title text-muted fs-6 mb-3">Enrollments Over Time</h5>
                    <div style="position: relative; height:300px;">
                        <canvas id="enrollmentsChart"></canvas>
                    </div>
                </div>
            </div>

            <!-- Bar Chart: Revenue Per Course -->
            <div class="col-lg-6">
                <div class="card border-0 shadow-sm p-3">
                    <h5 class="card-title text-muted fs-6 mb-3">Revenue per Course (PKR)</h5>
                    <div style="position: relative; height:300px;">
                        <canvas id="revenueChart"></canvas>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="/js/dashboard.js"></script>
</body>
</html>
